<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Колесо Фортуны — Мульти-проектная панель управления</title>
  <style>
    :root {
      --primary: #f43f5e;
      --gold: #fbbf24;
      --bg-dark: #0a0714;
      --card-bg: #140f24;
      --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TOP PANE: CONTROL DECK */
    .top-deck {
      background: linear-gradient(180deg, #18122c 0%, #100b1e 100%);
      border-bottom: 2px solid rgba(244, 63, 94, 0.35);
      padding: 18px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      position: relative;
      z-index: 1000;
    }
    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .deck-title {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .deck-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 9px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-apply {
      background: linear-gradient(135deg, #f43f5e, #fbbf24);
      color: #fff;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
    }
    .btn-apply:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(244, 63, 94, 0.6); }
    .btn-save {
      background: #10b981;
      color: #fff;
    }
    .btn-save:hover { background: #059669; }
    .btn-new {
      background: #6366f1;
      color: #fff;
    }
    .btn-new:hover { background: #4f46e5; }
    .btn-copy {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fbcfe8;
    }
    .btn-copy:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .btn-del {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
    }
    .btn-del:hover { background: #ef4444; color: #fff; }

    /* Project Switcher Bar */
    .project-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .project-bar label {
      font-size: 13px;
      font-weight: 700;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .project-select {
      flex: 1;
      min-width: 220px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      outline: none;
    }
    .project-id-input {
      width: 160px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: #cbd5e1;
      font-size: 13px;
      outline: none;
    }

    /* Controls Grid */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .control-group label {
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .control-group input, .control-group select {
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .control-group input:focus, .control-group select:focus {
      border-color: var(--gold);
    }

    /* Sectors Table Editor */
    .sectors-panel {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 12px 14px;
    }
    .sectors-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 700;
      color: #fbcfe8;
      text-transform: uppercase;
    }
    .sectors-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 8px;
      max-height: 150px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .sector-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .sector-item input[type="text"] {
      flex: 1;
      padding: 5px 6px;
      font-size: 12px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #fff;
    }
    .sector-item input[type="color"] {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }
    .sector-item .sec-prob {
      width: 48px;
      padding: 5px;
      font-size: 12px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #fbbf24;
      text-align: center;
    }

    /* BOTTOM PANE: LIVE SANDBOX */
    .bottom-sandbox {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      background: radial-gradient(circle at center, #1b1330 0%, #0a0714 100%);
      min-height: 480px;
    }
    .sandbox-watermark {
      position: absolute;
      top: 14px;
      left: 18px;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .sandbox-hero {
      text-align: center;
      max-width: 650px;
      margin-bottom: 20px;
    }
    .sandbox-hero h2 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 0%, #fbcfe8 50%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sandbox-hero p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .trigger-test-btn {
      padding: 14px 34px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #f43f5e 0%, #fbbf24 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(244, 63, 94, 0.5);
      transition: transform 0.2s;
    }
    .trigger-test-btn:hover { transform: translateY(-2px) scale(1.03); }
    .delay-status-badge {
      margin-top: 14px;
      font-size: 12px;
      color: #fbbf24;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- ================= TOP PANE: MULTI-PROJECT CONTROLS ================= -->
  <div class="top-deck">
    <div class="deck-header">
      <div class="deck-title">
        📁 МЕНЕДЖЕР ПРОЕКТОВ КОЛЕСА ФОРТУНЫ
        <span id="active-project-tag" style="font-size:12px; color:#4ade80; background:rgba(34,197,94,0.15); padding:3px 10px; border-radius:9999px;">Проект: WolfHunt</span>
      </div>
      <div class="deck-actions">
        <button class="btn btn-save" onclick="saveCurrentProject()">💾 Сохранить проект</button>
        <button class="btn btn-new" onclick="createNewProject()">➕ Новый проект</button>
        <button class="btn btn-apply" onclick="applySettings()">⚡ Тест внизу</button>
        <button class="btn btn-copy" onclick="copyEmbedCode()">📋 Код для Tilda</button>
        <button class="btn btn-del" onclick="deleteCurrentProject()">🗑️</button>
      </div>
    </div>

    <!-- Project Switcher -->
    <div class="project-bar">
      <label>Выбрать проект:</label>
      <select id="project-selector" class="project-select" onchange="switchProject(this.value)">
        <!-- populated from registry -->
      </select>
      <span style="font-size:12px; color:#94a3b8;">ID в коде:</span>
      <input type="text" id="project-slug" class="project-id-input" placeholder="id-proekta">
    </div>

    <!-- Quick Inputs Grid -->
    <div class="controls-grid">
      <div class="control-group">
        <label>Название проекта (для вас):</label>
        <input type="text" id="cfg-name" value="WolfHunt">
      </div>

      <div class="control-group">
        <label>Заголовок в колесе:</label>
        <input type="text" id="cfg-title" value="Бонус от WolfHunt!">
      </div>

      <div class="control-group">
        <label>Подзаголовок:</label>
        <input type="text" id="cfg-subtitle" value="Крути колесо и забирай разбор или скидку на запуск">
      </div>

      <div class="control-group">
        <label>Плавающая кнопка:</label>
        <input type="text" id="cfg-float-btn" value="🐺 Крутить колесо Волка">
      </div>

      <div class="control-group">
        <label>Задержка показа (сек):</label>
        <input type="number" id="cfg-delay" value="0" min="0" max="60" placeholder="0 = по клику">
      </div>

      <div class="control-group">
        <label>Telegram-бот (без @):</label>
        <input type="text" id="cfg-bot" value="greyzzzzwolf_bot">
      </div>

      <div class="control-group">
        <label>ID Яндекс.Метрики:</label>
        <input type="text" id="cfg-metrika" value="88058414">
      </div>
    </div>

    <!-- Sectors Live Table -->
    <div class="sectors-panel">
      <div class="sectors-header">
        <span>Сектора, призы и шансы выпадения (% вес)</span>
        <button onclick="addSector()" style="background:rgba(255,255,255,0.1); border:none; color:#fbbf24; font-size:11px; padding:3px 8px; border-radius:4px; cursor:pointer;">+ Добавить сектор</button>
      </div>
      <div class="sectors-list" id="sectors-editor">
        <!-- populated dynamically -->
      </div>
    </div>
  </div>

  <!-- ================= BOTTOM PANE: LIVE SANDBOX ================= -->
  <div class="bottom-sandbox">
    <div class="sandbox-watermark" id="sandbox-indicator">Превью: WolfHunt</div>
    
    <div class="sandbox-hero">
      <h2 id="preview-h2">WolfHunt / Grey Wolf</h2>
      <p id="preview-p">
        Виджет полностью изолирован под выбранный проект: свои призы, промокоды, бот и статистика спинов.
      </p>
      <button class="trigger-test-btn" onclick="openCurrentWheel()">
        🎁 Испытать Колесо
      </button>
      <div class="delay-status-badge" id="delay-timer-label"></div>
    </div>
  </div>

  <!-- WIDGET SCRIPT -->
  <script src="wheel-widget.js"></script>

  <script>
    // Начальная база проектов
    const INITIAL_PROJECTS = {
      wolfhunt: {
        name: 'WolfHunt (Грей Зед Вульф)',
        title: 'Бонус от WolfHunt!',
        subtitle: 'Крути колесо и забирай разбор или скидку на запуск',
        floatBtn: '🐺 Крутить колесо Волка',
        delay: 0,
        bot: 'greyzzzzwolf_bot',
        metrika: 88058414,
        sectors: [
          { id: 1, text: 'Разбор РК', color: '#e11d48', winText: 'Бесплатный видеообзор и анализ вашей РК', weight: 35, promo: 'WOLFAUDIT' },
          { id: 2, text: 'Скидка 5 000 ₽', color: '#181224', winText: 'Скидка 5 000 ₽ на настройку Яндекс Директ', weight: 25, promo: 'WOLF5000' },
          { id: 3, text: 'Скидка 15%', color: '#f59e0b', winText: 'Скидка 15% на ведение рекламы', weight: 15, promo: 'WOLF15' },
          { id: 4, text: 'Чек-лист', color: '#181224', winText: 'Закрытый чек-лист связок', weight: 15, promo: 'WOLFCHECK' },
          { id: 5, text: 'Инвайтинг TG', color: '#7c3aed', winText: 'Тестовый инвайтинг в Telegram / MAX', weight: 10, promo: 'WOLFINVITE' }
        ]
      },
      afrostudio: {
        name: 'Афростудия (Бьюти салон)',
        title: 'Секретный бонус студии!',
        subtitle: 'Крути колесо и забирай подарок на плетение кос',
        floatBtn: '🎁 Бонус на плетение',
        delay: 7,
        bot: 'afrostudio_bot',
        metrika: 88058414,
        sectors: [
          { id: 1, text: 'Скидка 15%', color: '#f43f5e', winText: 'Скидка 15% на первое плетение', weight: 30, promo: 'AFRO15' },
          { id: 2, text: 'Подарок 1 000 ₽', color: '#1c152a', winText: 'Сертификат 1 000 ₽ на комплект кос', weight: 25, promo: 'AFRO1000' },
          { id: 3, text: 'Скидка 20%', color: '#fb7185', winText: 'Скидка 20% на услуги салона', weight: 15, promo: 'AFRO20' },
          { id: 4, text: 'Уход в подарок', color: '#1c152a', winText: 'Премиум уход для волос в подарок', weight: 15, promo: 'AFROCARE' },
          { id: 5, text: 'Скидка 10%', color: '#9333ea', winText: 'Скидка 10% на любую услугу', weight: 10, promo: 'AFRO10' },
          { id: 6, text: 'VIP 2 000 ₽', color: '#4c1d95', winText: 'VIP Сертификат 2 000 ₽', weight: 5, promo: 'AFROVIP' }
        ]
      },
      ssp_agency: {
        name: 'SSP Agency (Обучение)',
        title: 'Грант на обучение рекламе',
        subtitle: 'Выбей максимальную скидку на практикум по Яндекс Директ',
        floatBtn: '🎓 Забрать скидку на курс',
        delay: 10,
        bot: 'ssp_agency_bot',
        metrika: 88058414,
        sectors: [
          { id: 1, text: 'Скидка 20%', color: '#2563eb', winText: 'Скидка 20% на курс', weight: 30, promo: 'SSP20' },
          { id: 2, text: 'Урок в подарок', color: '#131d33', winText: 'Доступ к закрытому уроку', weight: 25, promo: 'SSPFREE' },
          { id: 3, text: 'Скидка 30%', color: '#0284c7', winText: 'Скидка 30% на тариф Наставничество', weight: 15, promo: 'SSP30' },
          { id: 4, text: 'Разбор РК', color: '#131d33', winText: 'Персональный разбор вашей кампании', weight: 20, promo: 'SSPAUDIT' },
          { id: 5, text: 'Грант 5 000 ₽', color: '#4f46e5', winText: 'Грант 5 000 ₽ на обучение', weight: 10, promo: 'SSP5000' }
        ]
      }
    };

    // Загрузка реестра проектов из LocalStorage
    let projectsRegistry = {};
    try {
      const saved = localStorage.getItem('fw_projects_registry');
      if (saved) {
        projectsRegistry = JSON.parse(saved);
      } else {
        projectsRegistry = JSON.parse(JSON.stringify(INITIAL_PROJECTS));
        localStorage.setItem('fw_projects_registry', JSON.stringify(projectsRegistry));
      }
    } catch(e) {
      projectsRegistry = JSON.parse(JSON.stringify(INITIAL_PROJECTS));
    }

    let currentProjectId = 'wolfhunt';
    let currentSectors = [];

    function populateProjectSelector() {
      const sel = document.getElementById('project-selector');
      sel.innerHTML = '';
      for (let pid in projectsRegistry) {
        const opt = document.createElement('option');
        opt.value = pid;
        opt.innerText = `${projectsRegistry[pid].name || pid} [${pid}]`;
        if (pid === currentProjectId) opt.selected = true;
        sel.appendChild(opt);
      }
    }

    function switchProject(pid) {
      if (!projectsRegistry[pid]) return;
      currentProjectId = pid;
      const p = projectsRegistry[pid];

      document.getElementById('project-slug').value = pid;
      document.getElementById('cfg-name').value = p.name || pid;
      document.getElementById('cfg-title').value = p.title || '';
      document.getElementById('cfg-subtitle').value = p.subtitle || '';
      document.getElementById('cfg-float-btn').value = p.floatBtn || 'Подарок';
      document.getElementById('cfg-delay').value = p.delay !== undefined ? p.delay : 0;
      document.getElementById('cfg-bot').value = p.bot || '';
      document.getElementById('cfg-metrika').value = p.metrika || '';

      document.getElementById('active-project-tag').innerText = `Проект: ${p.name || pid}`;
      document.getElementById('sandbox-indicator').innerText = `Превью: ${p.name || pid}`;
      document.getElementById('preview-h2').innerText = p.name || pid;

      currentSectors = JSON.parse(JSON.stringify(p.sectors || []));
      renderSectorsEditor();
      applySettings();
    }

    function renderSectorsEditor() {
      const list = document.getElementById('sectors-editor');
      list.innerHTML = '';
      currentSectors.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = 'sector-item';
        item.innerHTML = `
          <input type="color" value="${s.color}" onchange="currentSectors[${idx}].color=this.value">
          <input type="text" value="${s.text}" placeholder="Текст" onchange="currentSectors[${idx}].text=this.value; currentSectors[${idx}].winText=this.value;">
          <input type="text" value="${s.promo}" style="width:65px;" placeholder="ПРОМО" onchange="currentSectors[${idx}].promo=this.value;">
          <input type="number" class="sec-prob" value="${s.weight}" title="Вес шанса" onchange="currentSectors[${idx}].weight=Number(this.value)">
          <button onclick="removeSector(${idx})" style="background:transparent; border:none; color:#f87171; cursor:pointer;">&times;</button>
        `;
        list.appendChild(item);
      });
    }

    function addSector() {
      currentSectors.push({
        id: Date.now(),
        text: 'Новый приз',
        color: '#f43f5e',
        winText: 'Новый подарок',
        weight: 15,
        promo: 'PROMO' + (currentSectors.length + 1)
      });
      renderSectorsEditor();
    }

    function removeSector(idx) {
      if (currentSectors.length <= 2) {
        alert('В колесе должно быть минимум 2 сектора!');
        return;
      }
      currentSectors.splice(idx, 1);
      renderSectorsEditor();
    }

    function saveCurrentProject() {
      const slug = document.getElementById('project-slug').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
      if (!slug) {
        alert('Укажите ID проекта латиницей (например: avtosalon, barbershop)');
        return;
      }

      const pData = {
        name: document.getElementById('cfg-name').value.trim() || slug,
        title: document.getElementById('cfg-title').value.trim(),
        subtitle: document.getElementById('cfg-subtitle').value.trim(),
        floatBtn: document.getElementById('cfg-float-btn').value.trim(),
        delay: Number(document.getElementById('cfg-delay').value) || 0,
        bot: document.getElementById('cfg-bot').value.trim(),
        metrika: Number(document.getElementById('cfg-metrika').value) || null,
        sectors: currentSectors
      };

      // Если сменили slug
      if (slug !== currentProjectId && projectsRegistry[currentProjectId]) {
        delete projectsRegistry[currentProjectId];
      }

      currentProjectId = slug;
      projectsRegistry[slug] = pData;
      localStorage.setItem('fw_projects_registry', JSON.stringify(projectsRegistry));

      populateProjectSelector();
      switchProject(slug);
      alert(`Проект «${pData.name}» успешно сохранен!`);
    }

    function createNewProject() {
      const name = prompt('Введите название нового проекта (клиента):', 'Клиент ' + (Object.keys(projectsRegistry).length + 1));
      if (!name) return;
      const slug = 'proj_' + Date.now().toString(36);

      projectsRegistry[slug] = {
        name: name,
        title: 'Подарок для вас!',
        subtitle: 'Испытайте удачу и заберите скидку или бонус',
        floatBtn: '🎁 Крутить колесо',
        delay: 5,
        bot: 'your_bot',
        metrika: null,
        sectors: [
          { id: 1, text: 'Скидка 10%', color: '#f43f5e', winText: 'Скидка 10%', weight: 40, promo: 'SALE10' },
          { id: 2, text: 'Бонус 1 000 ₽', color: '#1e1b2e', winText: 'Бонус 1 000 ₽', weight: 30, promo: 'GIFT1000' },
          { id: 3, text: 'Скидка 20%', color: '#fb7185', winText: 'Скидка 20%', weight: 20, promo: 'SALE20' },
          { id: 4, text: 'VIP Подарок', color: '#7c3aed', winText: 'VIP Подарок', weight: 10, promo: 'VIP' }
        ]
      };

      localStorage.setItem('fw_projects_registry', JSON.stringify(projectsRegistry));
      populateProjectSelector();
      switchProject(slug);
    }

    function deleteCurrentProject() {
      if (Object.keys(projectsRegistry).length <= 1) {
        alert('Нельзя удалить единственный проект!');
        return;
      }
      if (!confirm(`Удалить проект «${projectsRegistry[currentProjectId].name}»?`)) return;

      delete projectsRegistry[currentProjectId];
      localStorage.setItem('fw_projects_registry', JSON.stringify(projectsRegistry));
      const firstId = Object.keys(projectsRegistry)[0];
      populateProjectSelector();
      switchProject(firstId);
    }

    let delayTimer = null;

    function applySettings() {
      const oldBtn = document.getElementById('fw-trigger-btn');
      if (oldBtn) oldBtn.remove();
      const oldModal = document.getElementById('fw-modal');
      if (oldModal) oldModal.remove();
      const oldStyle = document.getElementById('fw-styles');
      if (oldStyle) oldStyle.remove();

      const delaySec = Number(document.getElementById('cfg-delay').value) || 0;

      const newConfig = {
        projectId: currentProjectId,
        title: document.getElementById('cfg-title').value,
        subtitle: document.getElementById('cfg-subtitle').value,
        floatingBtnText: document.getElementById('cfg-float-btn').value,
        telegramBot: document.getElementById('cfg-bot').value,
        metrikaCounterId: document.getElementById('cfg-metrika').value ? Number(document.getElementById('cfg-metrika').value) : null,
        sectors: currentSectors,
        allowMultipleSpins: true
      };

      window.fwInstance = new window.FortuneWheelWidget(newConfig);

      clearTimeout(delayTimer);
      const timerLabel = document.getElementById('delay-timer-label');
      if (delaySec > 0) {
        timerLabel.innerText = `⏳ Авто-открытие через ${delaySec} сек...`;
        delayTimer = setTimeout(() => {
          if (window.fwInstance) window.fwInstance.openModal();
          timerLabel.innerText = '✅ Виджет сработал по таймеру';
        }, delaySec * 1000);
      } else {
        timerLabel.innerText = 'Виджет готов к ручному клику';
      }
    }

    function openCurrentWheel() {
      if (window.fwInstance) {
        window.fwInstance.openModal();
      }
    }

    function copyEmbedCode() {
      const delaySec = Number(document.getElementById('cfg-delay').value) || 0;
      const p = projectsRegistry[currentProjectId] || {};

      const code = `<!-- FORTUNE WHEEL WIDGET (Проект: ${p.name || currentProjectId}) -->
<script src="https://snesterov.github.io/fortune-wheel/wheel-widget.js?p=${currentProjectId}" defer><\\/script>
<script>
  window.FORTUNE_WHEEL_CONFIG = {
    projectId: "${currentProjectId}",
    title: "${document.getElementById('cfg-title').value.replace(/"/g, '\\"')}",
    subtitle: "${document.getElementById('cfg-subtitle').value.replace(/"/g, '\\"')}",
    floatingBtnText: "${document.getElementById('cfg-float-btn').value.replace(/"/g, '\\"')}",
    telegramBot: "${document.getElementById('cfg-bot').value}",
    metrikaCounterId: ${document.getElementById('cfg-metrika').value || 'null'},
    delay: ${delaySec},
    sectors: ${JSON.stringify(currentSectors, null, 4)}
  };
<\\/script>`;

      navigator.clipboard.writeText(code).then(() => {
        alert(`Код для проекта «${p.name || currentProjectId}» скопирован в буфер обмена!`);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      populateProjectSelector();
      switchProject('wolfhunt');
    });
  </script>
</body>
</html>
